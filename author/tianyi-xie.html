---
layout: default
title: "Posts by Tianyi Xie"
---

<h1>Posts by Tianyi Xie</h1>
<ul>
  {% for post in site.posts %}
    {% if post.author == "Tianyi Xie" %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a> - <time datetime="{{ post.date }}">{{ post.date | date: "%B %d, %Y" }}</time>
      </li>
    {% endif %}
  {% endfor %}
</ul>
