---
layout: post
title: "Posts Uncategorized"
---

<ul>
  {% for post in site.posts %}
    {% if post.categories.size == 1 %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a> - <time datetime="{{ post.date }}">{{ post.date | date: "%B %d, %Y" }}</time>
      </li>
    {% endif %}
  {% endfor %}
</ul>
