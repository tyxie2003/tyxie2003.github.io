---
layout: default
title: "Category Archive"
---

<h1>Posts in "Reading"</h1>
<ul>
    {% for post in site.posts %}
      {% if post.categories contains "Reading" %}
        <li>
          <a href="{{ post.url }}">{{ post.title }}</a> - <time datetime="{{ post.date }}">{{ post.date | date: "%B %d, %Y" }}</time>
        </li>
      {% endif %}
    {% endfor %}
  </ul>
